[project]
name = "hermes-work"
version = "0.1.0"
description = "Hermes Agent skills and tools for biomedical data workflows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "click>=8.5.0",
    "duckdb>=1.5.6",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".agents"]
